[package]
name = "rust-fs-fat32"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Read-only FAT12, FAT16 and FAT32 filesystem driver"
repository = "https://github.com/antimatter-studios/rust-fs-fat"

[lib]
name = "fs_fat32"

[dependencies]
rust-fs-core = "=0.4.3"

[features]
# Tests that need the independent oracles (mkfs.fat, fsck.fat, mtools and the
# kernel's vfat driver). They fail, never skip, when the oracles cannot run:
# `chore test:oracle` provides them in the Linux test VM.
oracle = []

[[test]]
name = "independent_validation"
required-features = ["oracle"]
